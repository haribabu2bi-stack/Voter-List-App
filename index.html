<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#135e4a">
<title>Voter List Manager</title>
<style>
:root{--green:#135e4a;--bg:#f3f6f5;--card:#fff;--ink:#17211e;--muted:#65736e;--line:#dce5e1;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Telugu",sans-serif}
header{background:var(--green);color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0002}
header h1{font-size:21px;margin:0 0 4px}header p{font-size:12px;margin:0;opacity:.9}
main{max-width:1000px;margin:auto;padding:14px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.card{background:var(--card);padding:12px;border-radius:12px;box-shadow:0 1px 4px #0000000b}
.card .num{font-weight:750;font-size:22px;color:var(--green)}.card .label{font-size:12px;color:var(--muted)}
.panel{background:#fff;padding:12px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 4px #0000000b}
input,select,button{font:inherit;border-radius:9px;padding:11px;border:1px solid var(--line);width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid #a4d3c5}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.search{grid-column:1/-1}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}
button{background:var(--green);color:#fff;border:0;font-weight:650;cursor:pointer}
button.secondary{background:#e5f0ec;color:var(--green)}button.danger{background:#fff0ef;color:var(--red);border:1px solid #f4c7c3}
.results-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 10px;font-size:13px;color:var(--muted)}
.person{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px}
.person-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.person h3{font-size:16px;line-height:1.45;margin:0 0 4px}.serial{font-size:12px;color:var(--muted);white-space:nowrap}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;margin-top:10px;font-size:13px}
.meta div{min-width:0;overflow-wrap:anywhere}.meta b{display:block;font-size:11px;color:var(--muted);font-weight:600}
.person-actions{display:flex;gap:8px;margin-top:11px}.person-actions button{padding:9px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
dialog{border:0;border-radius:16px;width:min(94vw,560px);max-height:90vh;padding:0;box-shadow:0 12px 50px #0004}
dialog::backdrop{background:#10251fcc}.modal-head{background:var(--green);color:#fff;padding:15px 17px;display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:18px;margin:0}
.modal-body{padding:14px;overflow:auto;max-height:70vh}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.field input{padding:10px}
.modal-actions{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}.modal-actions button{flex:1}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}
@media(min-width:720px){.filters{grid-template-columns:2fr 1fr 1fr 1fr}.search{grid-column:auto}.actions{grid-template-columns:repeat(4,1fr)}.list{display:grid;grid-template-columns:1fr 1fr;gap:9px}.person{margin-bottom:0}}
</style>
</head>
<body>
<header><h1>Voter List Manager</h1><p>Offline voter details • మీ ఫోన్‌లోనే వివరాలు</p></header>
<main>
  <section class="cards">
    <div class="card"><div class="num" id="totalCount">0</div><div class="label">మొత్తం ఓటర్లు</div></div>
    <div class="card"><div class="num" id="shownCount">0</div><div class="label">కనిపిస్తున్నవి</div></div>
    <div class="card"><div class="num" id="surnameCount">0</div><div class="label">ఇంటిపేర్లు</div></div>
  </section>
  <section class="panel">
    <div class="filters">
      <input id="search" class="search" placeholder="పేరు / ఇంటిపేరు / మొబైల్ / Voter ID వెతకండి">
      <select id="surnameFilter"><option value="">అన్ని ఇంటిపేర్లు</option></select>
      <select id="casteFilter"><option value="">అన్ని కులాలు</option></select>
      <select id="genderFilter"><option value="">అన్ని Gender</option><option>Male</option><option>Female</option><option>Other</option></select>
    </div>
    <div class="actions">
      <button id="addBtn">＋ కొత్త ఓటరు</button>
      <button class="secondary" id="exportBtn">Excel/CSV Export</button>
      <button class="secondary" id="backupBtn">Backup Save</button>
      <button class="secondary" id="restoreBtn">Backup Restore</button>
      <input id="restoreFile" type="file" accept=".json,application/json" hidden>
    </div>
    <div class="note">డేటా ఈ బ్రౌజర్‌లోనే సేవ్ అవుతుంది. ఫోన్/బ్రౌజర్ డేటా తొలగించే ముందు Backup Save చేయండి. CSV ఫైల్‌ను Excel‌లో తెరవవచ్చు.</div>
  </section>
  <div class="results-head"><span id="resultText">ఓటర్ల జాబితా</span><span>క్రమ సంఖ్యతో</span></div>
  <section id="list" class="list"></section>
</main>

<dialog id="editor">
  <div class="modal-head"><h2 id="modalTitle">ఓటరు వివరాలు</h2><button type="button" id="closeModal" style="width:auto;padding:6px 10px;background:#ffffff22">✕</button></div>
  <form id="voterForm">
    <div class="modal-body"><div id="formFields" class="form-grid"></div></div>
    <div class="modal-actions"><button type="button" class="secondary" id="cancelBtn">రద్దు</button><button type="submit">Save</button></div>
  </form>
</dialog>

e":"26","Voter ID":"SGA1195189","INTIAL":"GARRE","CASTE":"VYSYA","Death":""},{"S.No":"1324","MOBILE":"7013336918","SECOND":"","పేరు":"అబుల్ వహీద్ షేక్","తండ్రి / భర్త":"బాజి షేక్","Gender":"Male","Age":"20","Voter ID":"SZO2763571","INTIAL":"SHAIK","CASTE":"MUSLIM","Death":""},{"S.No":"1325","MOBILE":"9666742736","SECOND":"","పేరు":"మెహతాజ్ భాను షేక్","తండ్రి / భర్త":"దరయు నాగూర్ వలి షేక్","Gender":"Female","Age":"19","Voter ID":"SZO2768661","INTIAL":"SHAIK","CASTE":"MUSLIM","Death":""},{"S.No":"1326","MOBILE":"7780592089","SECOND":"","పేరు":"మహమ్మద్ ద్ గౌసే షేక్","తండ్రి / భర్త":"జాని బాషా","Gender":"Male","Age":"36","Voter ID":"SZO1566736","INTIAL":"SHAIK","CASTE":"MUSLIM","Death":""}];
const FIELDS = ["S.No","MOBILE","SECOND","పేరు","తండ్రి / భర్త","Gender","Age","Voter ID","INTIAL","CASTE","Death","Other Details","Additional Notes"];
const STORE_KEY = "voter_list_manager_data_v3";
let voters = loadData();
let editingIndex = -1;
const $ = id => document.getElementById(id);
function loadData(){
  try { const saved = localStorage.getItem(STORE_KEY); if(saved) return JSON.parse(saved); } catch(e){}
  return INITIAL_DATA.map(x=>({...x}));
}
function persist(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(voters)); } catch(e){ alert("ఫోన్‌లో నిల్వ స్థలం సరిపోలేదు. Backup తీసుకుని కొన్ని రికార్డులు తొలగించండి."); } }
function val(v){return v==null?"":String(v)}
function esc(s){return val(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uniqueValues(field){return [...new Set(voters.map(v=>val(v[field]).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));}
function fillFilter(id,field,label){
 const el=$(id), old=el.value; el.innerHTML=`<option value="">${label}</option>`;
 uniqueValues(field).forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;el.appendChild(o)});
 if([...el.options].some(o=>o.value===old))el.value=old;
}
function render(){
 fillFilter("surnameFilter","INTIAL","అన్ని ఇంటిపేర్లు");
 fillFilter("casteFilter","CASTE","అన్ని కులాలు");
 const q=$("search").value.trim().toLocaleLowerCase();
 const sur=$("surnameFilter").value, caste=$("casteFilter").value, gender=$("genderFilter").value;
 const filtered=voters.map((v,i)=>({v,i})).filter(({v})=>{
   const hay=FIELDS.map(k=>val(v[k])).join(" ").toLocaleLowerCase();
   return (!q||hay.includes(q))&&(!sur||val(v["INTIAL"])===sur)&&(!caste||val(v["CASTE"])===caste)&&(!gender||val(v["Gender"])===gender);
 });
 $("totalCount").textContent=voters.length.toLocaleString("en-IN");
 $("shownCount").textContent=filtered.length.toLocaleString("en-IN");
 $("surnameCount").textContent=uniqueValues("INTIAL").length.toLocaleString("en-IN");
 $("resultText").textContent=`${filtered.length.toLocaleString("en-IN")} మంది ఓటర్లు`;
 const list=$("list");
 if(!filtered.length){list.innerHTML='<div class="panel empty">రికార్డులు కనిపించలేదు</div>';return}
 list.innerHTML=filtered.map(({v,i})=>`
 <article class="person">
   <div class="person-top"><div><h3>${esc(v["పేరు"]||"పేరు నమోదు కాలేదు")}</h3><div class="serial">S.No: ${esc(v["S.No"])} · ${esc(v["INTIAL"])}</div></div><div class="serial">${esc(v["Gender"])} · ${esc(v["Age"])} yrs</div></div>
   <div class="meta">
    <div><b>తండ్రి / భర్త</b>${esc(v["తండ్రి / భర్త"])||"—"}</div>
    <div><b>మొబైల్</b>${esc(v["MOBILE"])||"—"}</div>
    <div><b>Voter ID</b>${esc(v["Voter ID"])||"—"}</div>
    <div><b>కులం</b>${esc(v["CASTE"])||"—"}</div>
    <div><b>SECOND</b>${esc(v["SECOND"])||"—"}</div>
    <div><b>Death</b>${esc(v["Death"])||"—"}</div>
   </div>
   <div class="person-actions"><button class="secondary" onclick="editVoter(${i})">Edit / మార్చు</button><button class="danger" onclick="deleteVoter(${i})">Delete / తొలగించు</button></div>
 </article>`).join("");
}
function openEditor(index){
 editingIndex=index;
 $("modalTitle").textContent=index<0?"కొత్త ఓటరు జోడించండి":"ఓటరు వివరాలు మార్చండి";
 const item=index<0?{"S.No":String(nextSerial())}:voters[index];
 $("formFields").innerHTML=FIELDS.map(f=>`<div class="field"><label for="f_${FIELDS.indexOf(f)}">${esc(f)}</label><input id="f_${FIELDS.indexOf(f)}" name="${esc(f)}" value="${esc(item[f])}" ${f==="S.No"?'inputmode="numeric"':''}></div>`).join("");
 $("editor").showModal();
}
function nextSerial(){return voters.reduce((m,v)=>Math.max(m,parseInt(v["S.No"],10)||0),0)+1}
window.editVoter=i=>openEditor(i);
window.deleteVoter=i=>{
 const name=voters[i]["పేరు"]||"ఈ ఓటరు";
 if(confirm(`${name} వివరాలను తొలగించాలా?`)){voters.splice(i,1);persist();render();}
};
$("addBtn").onclick=()=>openEditor(-1);
$("closeModal").onclick=$("cancelBtn").onclick=()=> $("editor").close();
$("voterForm").onsubmit=e=>{
 e.preventDefault();const obj={};
 FIELDS.forEach((f,i)=>obj[f]=$("f_"+i).value.trim());
 if(!obj["పేరు"]){alert("ఓటరు పేరు నమోదు చేయండి.");return}
 if(editingIndex<0)voters.push(obj);else voters[editingIndex]=obj;
 persist();$("editor").close();render();
};
["search","surnameFilter","casteFilter","genderFilter"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",render));
function download(filename,content,type){
 const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$("exportBtn").onclick=()=>{
 const csv=[FIELDS,...voters.map(v=>FIELDS.map(f=>val(v[f])))].map(row=>row.map(x=>'"'+val(x).replace(/"/g,'""')+'"').join(",")).join("\r\n");
 download("voter_list_export.csv","\ufeff"+csv,"text/csv;charset=utf-8");
};
$("backupBtn").onclick=()=>download("voter_list_backup.json",JSON.stringify(voters,null,2),"application/json");
$("restoreBtn").onclick=()=>$("restoreFile").click();
$("restoreFile").onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{const data=JSON.parse(await f.text());if(!Array.isArray(data))throw Error("bad");
 if(confirm(`Backup‌లో ${data.length} రికార్డులు ఉన్నాయి. ప్రస్తుత డేటా స్థానంలో restore చేయాలా?`)){voters=data.map(v=>{const o={};FIELDS.forEach(k=>o[k]=val(v[k]));return o});persist();render();alert("Backup restore అయింది.");}
 }catch(err){alert("ఈ backup JSON ఫైల్ సరైనది కాదు.");}e.target.value="";
};
render();
</script>
