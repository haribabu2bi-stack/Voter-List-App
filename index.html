<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ఓటర్ జాబితా - వార్డ్ 19 (Voter List)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #1a73e8;
            --secondary-color: #3c4043;
            --bg-color: #f8f9fa;
        }
        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
        }
        .header-box {
            background: linear-gradient(135deg, #0d6efd, #0d47a1);
            color: white;
            padding: 20px 15px;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .stats-card {
            background: white;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
            margin-bottom: 10px;
        }
        .stats-card .num {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0d6efd;
        }
        .card-voter {
            background: white;
            border-radius: 10px;
            border-left: 5px solid #0d6efd;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            margin-bottom: 12px;
            padding: 12px 15px;
            transition: transform 0.2s;
        }
        .card-voter:hover {
            transform: translateY(-2px);
        }
        .voter-id-badge {
            background: #e7f1ff;
            color: #0d6efd;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 13px;
        }
        .caste-badge {
            background: #fff3cd;
            color: #856404;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 12px;
        }
        .death-badge {
            background: #f8d7da;
            color: #842029;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 12px;
        }
        .btn-call {
            background-color: #198754;
            color: white;
            border-radius: 50px;
            padding: 5px 12px;
            text-decoration: none;
            font-size: 13px;
            display: inline-block;
        }
        .btn-call:hover {
            color: white;
            background-color: #146c43;
        }
        .filter-section {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }
        @media (min-width: 768px) {
            .view-toggle {
                display: block;
            }
        }
    </style>
</head>
<body>

<div class="header-box text-center mb-3">
    <h3 class="fw-bold mb-1"><i class="fa-solid fa-users-gear me-2"></i>ఓటర్ల జాబితా (Voter List)</h3>
    <p class="mb-0 text-white-50">వార్డ్ 19 - సమాచారం & నిర్వహణ</p>
</div>

<div class="container mb-5">
    <!-- Action Bar & Controls -->
    <div class="filter-section">
        <div class="row g-2">
            <div class="col-md-4 col-12">
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <input type="text" id="searchInput" class="form-control" placeholder="పేరు / ఇంటిపేరు / Voter ID / మొబైల్..." onkeyup="filterVoters()">
                </div>
            </div>
            <div class="col-md-3 col-6">
                <select id="casteFilter" class="form-select" onchange="filterVoters()">
                    <option value="">అన్ని కులాలు (All Castes)</option>
                </select>
            </div>
            <div class="col-md-3 col-6">
                <select id="genderFilter" class="form-select" onchange="filterVoters()">
                    <option value="">లింగం (All Gender)</option>
                    <option value="Male">పురుషులు (Male)</option>
                    <option value="Female">స్త్రీలు (Female)</option>
                </select>
            </div>
            <div class="col-md-2 col-12 d-flex gap-1">
                <button class="btn btn-outline-primary w-100" onclick="resetFilters()"><i class="fa-solid fa-rotate me-1"></i> రీసెట్</button>
            </div>
        </div>
        <hr class="my-3">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div>
                <button class="btn btn-sm btn-success me-1" onclick="addNewVoterModal()"><i class="fa-solid fa-user-plus me-1"></i> కొత్త ఓటరు</button>
                <button class="btn btn-sm btn-outline-success me-1" onclick="exportToExcel()"><i class="fa-solid fa-file-excel me-1"></i> Excel Export</button>
                <button class="btn btn-sm btn-outline-secondary me-1" onclick="downloadBackup()"><i class="fa-solid fa-download me-1"></i> Backup</button>
                <button class="btn btn-sm btn-outline-info" onclick="triggerRestore()"><i class="fa-solid fa-upload me-1"></i> Restore</button>
                <input type="file" id="restoreFileInput" style="display:none;" onchange="restoreData(event)" accept=".json">
            </div>
            <div class="btn-group btn-group-sm">
                <button type="button" class="btn btn-outline-primary active" id="btnCardView" onclick="setViewMode('card')"><i class="fa-solid fa-address-card"></i> Card</button>
                <button type="button" class="btn btn-outline-primary" id="btnTableView" onclick="setViewMode('table')"><i class="fa-solid fa-table"></i> Table</button>
            </div>
        </div>
    </div>

    <!-- Summary Stats -->
    <div class="row g-2 mb-3">
        <div class="col-6 col-md-3">
            <div class="stats-card">
                <div class="text-muted small">మొత్తం ఓటర్లు</div>
                <div class="num" id="totalCount">0</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stats-card">
                <div class="text-muted small">పురుషులు</div>
                <div class="num text-primary" id="maleCount">0</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stats-card">
                <div class="text-muted small">స్త్రీలు</div>
                <div class="num text-danger" id="femaleCount">0</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stats-card">
                <div class="text-muted small">మొబైల్ ఉన్నవి</div>
                <div class="num text-success" id="mobileCount">0</div>
            </div>
        </div>
    </div>

    <!-- Card View Container -->
    <div id="cardViewContainer" class="row"></div>

    <!-- Table View Container -->
    <div id="tableViewContainer" class="table-responsive bg-white rounded shadow-sm p-3 d-none">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>క్రమ సంఖ్య</th>
                    <th>ఇంటిపేరు</th>
                    <th>పేరు</th>
                    <th>తండ్రి/భర్త</th>
                    <th>లింగం / వయస్సు</th>
                    <th>కులం</th>
                    <th>Voter ID</th>
                    <th>మొబైల్</th>
                    <th>చర్యలు</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<!-- Add/Edit Voter Modal -->
<div class="modal fade" id="voterModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalTitle">ఓటరు వివరాలు</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editSno">
                <div class="row g-2">
                    <div class="col-6 mb-2">
                        <label class="form-label fw-bold">ఇంటిపేరు (Initial)</label>
                        <input type="text" id="editInitial" class="form-control">
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label fw-bold">పేరు (Name)</label>
                        <input type="text" id="editName" class="form-control" required>
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label fw-bold">తండ్రి / భర్త పేరు</label>
                        <input type="text" id="editRel" class="form-control">
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label fw-bold">Voter ID</label>
                        <input type="text" id="editVoterId" class="form-control">
                    </div>
                    <div class="col-4 mb-2">
                        <label class="form-label fw-bold">లింగం</label>
                        <select id="editGender" class="form-select">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="col-4 mb-2">
                        <label class="form-label fw-bold">వయస్సు</label>
                        <input type="number" id="editAge" class="form-control">
                    </div>
                    <div class="col-4 mb-2">
                        <label class="form-label fw-bold">కులం (Caste)</label>
                        <input type="text" id="editCaste" class="form-control">
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label fw-bold">మొబైల్ నంబరు</label>
                        <input type="text" id="editMobile" class="form-control">
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label fw-bold">రెండవ మొబైల్</label>
                        <input type="text" id="editSecondMobile" class="form-control">
                    </div>
                    <div class="col-12 mb-2">
                        <label class="form-label fw-bold">స్థితి / గమనిక (Death/Note)</label>
                        <input type="text" id="editDeath" class="form-control" placeholder="ఉదా: Expired / Death">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">రద్దు</button>
                <button type="button" class="btn btn-primary" onclick="saveVoter()">సేవ్ చేయండి</button>
            </div>
        </div>
    </div>
</div>

    let votersData = [];
    let currentView = 'card';

    // Load Data
    function initData() {
        const saved = localStorage.getItem('voters_list_ward19');
        if (saved) {
            try {
                votersData = JSON.parse(saved);
            } catch(e) {
                votersData = initialData;
            }
        } else {
            votersData = initialData;
        }
        populateCasteDropdown();
        filterVoters();
    }

    function saveData() {
        localStorage.setItem('voters_list_ward19', JSON.stringify(votersData));
        populateCasteDropdown();
        filterVoters();
    }

    function populateCasteDropdown() {
        const select = document.getElementById('casteFilter');
        const currentVal = select.value;
        const castes = [...new Set(votersData.map(v => v.caste).filter(c => c && c.trim() !== ''))].sort();
        select.innerHTML = '<option value="">అన్ని కులాలు (All Castes)</option>';
        castes.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c;
            opt.textContent = c;
            select.appendChild(opt);
        });
        select.value = currentVal;
    }

    function filterVoters() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const casteVal = document.getElementById('casteFilter').value;
        const genderVal = document.getElementById('genderFilter').value;

        const filtered = votersData.filter(v => {
            const matchQuery = !query || 
                v.name.toLowerCase().includes(query) ||
                v.initial.toLowerCase().includes(query) ||
                v.voter_id.toLowerCase().includes(query) ||
                v.rel.toLowerCase().includes(query) ||
                String(v.mobile).includes(query);
            
            const matchCaste = !casteVal || v.caste === casteVal;
            const matchGender = !genderVal || v.gender === genderVal;

            return matchQuery && matchCaste && matchGender;
        });

        updateStats(filtered);
        renderData(filtered);
    }

    function updateStats(list) {
        document.getElementById('totalCount').innerText = list.length;
        document.getElementById('maleCount').innerText = list.filter(v => v.gender === 'Male').length;
        document.getElementById('femaleCount').innerText = list.filter(v => v.gender === 'Female').length;
        document.getElementById('mobileCount').innerText = list.filter(v => v.mobile && String(v.mobile).trim() !== '').length;
    }

    function renderData(list) {
        if (currentView === 'card') {
            renderCardView(list);
        } else {
            renderTableView(list);
        }
    }

    function renderCardView(list) {
        const container = document.getElementById('cardViewContainer');
        if (list.length === 0) {
            container.innerHTML = '<div class="col-12 text-center py-5 text-muted">ఏమి రికార్డులు లభించలేదు.</div>';
            return;
        }

        let htmlStr = '';
        list.forEach((v) => {
            const indexInMain = votersData.findIndex(item => item.sno === v.sno);
            htmlStr += `
            <div class="col-md-6 col-lg-4">
                <div class="card-voter">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div>
                            <span class="badge bg-secondary me-1">#${v.sno}</span>
                            <span class="voter-id-badge">${v.voter_id || 'N/A'}</span>
                        </div>
                        <div>
                            ${v.caste ? `<span class="caste-badge">${v.caste}</span>` : ''}
                            ${v.death ? `<span class="death-badge ms-1">${v.death}</span>` : ''}
                        </div>
                    </div>
                    <h5 class="fw-bold mb-1 text-dark">${v.initial ? v.initial + ' ' : ''}${v.name}</h5>
                    <div class="text-muted small mb-2">
                        <i class="fa-solid fa-user-group me-1"></i> తండ్రి/భర్త: <strong>${v.rel || '-'}</strong>
                    </div>
                    <div class="d-flex gap-3 text-muted small mb-3">
                        <span><i class="fa-solid fa-venus-mars me-1"></i> ${v.gender || '-'}</span>
                        <span><i class="fa-solid fa-calendar me-1"></i> వయస్సు: ${v.age || '-'}</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                        <div>
                            ${v.mobile ? `<a href="tel:${v.mobile}" class="btn-call"><i class="fa-solid fa-phone me-1"></i> ${v.mobile}</a>` : '<span class="text-muted small"><i class="fa-solid fa-phone-slash me-1"></i> ఫోన్ లేదు</span>'}
                        </div>
                        <div>
                            <button class="btn btn-sm btn-outline-primary py-0 px-2 me-1" onclick="editVoter(${indexInMain})"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-sm btn-outline-danger py-0 px-2" onclick="deleteVoter(${indexInMain})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            </div>`;
        });
        container.innerHTML = htmlStr;
    }

    function renderTableView(list) {
        const tbody = document.getElementById('tableBody');
        if (list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center py-4 text-muted">ఏమి రికార్డులు లభించలేదు.</td></tr>';
            return;
        }

        let htmlStr = '';
        list.forEach((v) => {
            const indexInMain = votersData.findIndex(item => item.sno === v.sno);
            htmlStr += `
            <tr>
                <td>${v.sno}</td>
                <td><strong>${v.initial || '-'}</strong></td>
                <td><strong class="text-primary">${v.name}</strong></td>
                <td>${v.rel || '-'}</td>
                <td>${v.gender} / ${v.age}</td>
                <td><span class="badge bg-light text-dark border">${v.caste || '-'}</span></td>
                <td><code>${v.voter_id || '-'}</code></td>
                <td>${v.mobile ? `<a href="tel:${v.mobile}" class="text-decoration-none fw-bold text-success"><i class="fa-solid fa-phone me-1"></i>${v.mobile}</a>` : '-'}</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary py-0 px-2 me-1" onclick="editVoter(${indexInMain})"><i class="fa-solid fa-pen"></i></button>
                    <button class="btn btn-sm btn-outline-danger py-0 px-2" onclick="deleteVoter(${indexInMain})"><i class="fa-solid fa-trash"></i></button>
                </td>
            </tr>`;
        });
        tbody.innerHTML = htmlStr;
    }

    function setViewMode(mode) {
        currentView = mode;
        if (mode === 'card') {
            document.getElementById('cardViewContainer').classList.remove('d-none');
            document.getElementById('tableViewContainer').classList.add('d-none');
            document.getElementById('btnCardView').classList.add('active');
            document.getElementById('btnTableView').classList.remove('active');
        } else {
            document.getElementById('cardViewContainer').classList.add('d-none');
            document.getElementById('tableViewContainer').classList.remove('d-none');
            document.getElementById('btnCardView').classList.remove('active');
            document.getElementById('btnTableView').classList.add('active');
        }
        filterVoters();
    }

    function resetFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('casteFilter').value = '';
        document.getElementById('genderFilter').value = '';
        filterVoters();
    }

    // Add / Edit Modal Actions
    let modalInstance;
    document.addEventListener('DOMContentLoaded', () => {
        modalInstance = new bootstrap.Modal(document.getElementById('voterModal'));
        initData();
    });

    function addNewVoterModal() {
        document.getElementById('modalTitle').innerText = 'కొత్త ఓటరును చేర్చండి';
        document.getElementById('editSno').value = '';
        document.getElementById('editInitial').value = '';
        document.getElementById('editName').value = '';
        document.getElementById('editRel').value = '';
        document.getElementById('editVoterId').value = '';
        document.getElementById('editGender').value = 'Male';
        document.getElementById('editAge').value = '';
        document.getElementById('editCaste').value = '';
        document.getElementById('editMobile').value = '';
        document.getElementById('editSecondMobile').value = '';
        document.getElementById('editDeath').value = '';
        modalInstance.show();
    }

    function editVoter(index) {
        const v = votersData[index];
        document.getElementById('modalTitle').innerText = 'ఓటరు వివరాలు సవరించు (Edit)';
        document.getElementById('editSno').value = index;
        document.getElementById('editInitial').value = v.initial || '';
        document.getElementById('editName').value = v.name || '';
        document.getElementById('editRel').value = v.rel || '';
        document.getElementById('editVoterId').value = v.voter_id || '';
        document.getElementById('editGender').value = v.gender || 'Male';
        document.getElementById('editAge').value = v.age || '';
        document.getElementById('editCaste').value = v.caste || '';
        document.getElementById('editMobile').value = v.mobile || '';
        document.getElementById('editSecondMobile').value = v.second_mobile || '';
        document.getElementById('editDeath').value = v.death || '';
        modalInstance.show();
    }

    function saveVoter() {
        const name = document.getElementById('editName').value.trim();
        if (!name) {
            alert('దయచేసి పేరు నమోదు చేయండి!');
            return;
        }
        const editIndex = document.getElementById('editSno').value;

        const voterObj = {
            sno: editIndex !== '' ? votersData[editIndex].sno : (votersData.length ? Math.max(...votersData.map(v => v.sno)) + 1 : 1),
            initial: document.getElementById('editInitial').value.trim(),
            name: name,
            rel: document.getElementById('editRel').value.trim(),
            voter_id: document.getElementById('editVoterId').value.trim(),
            gender: document.getElementById('editGender').value,
            age: document.getElementById('editAge').value.trim(),
            caste: document.getElementById('editCaste').value.trim(),
            mobile: document.getElementById('editMobile').value.trim(),
            second_mobile: document.getElementById('editSecondMobile').value.trim(),
            death: document.getElementById('editDeath').value.trim()
        };

        if (editIndex !== '') {
            votersData[editIndex] = voterObj;
        } else {
            votersData.unshift(voterObj);
        }

        saveData();
        modalInstance.hide();
    }

    function deleteVoter(index) {
        if (confirm('మీరు నిజంగా ఈ రికార్డును తొలగించాలనుకుంటున్నారా?')) {
            votersData.splice(index, 1);
            saveData();
        }
    }

    // Excel Export
    function exportToExcel() {
        const exportData = votersData.map(v => ({
            'S.No': v.sno,
            'ఇంటిపేరు (Initial)': v.initial,
            'పేరు (Name)': v.name,
            'తండ్రి / భర్త': v.rel,
            'లింగం (Gender)': v.gender,
            'వయస్సు (Age)': v.age,
            'Voter ID': v.voter_id,
            'కులం (Caste)': v.caste,
            'మొబైల్ (Mobile)': v.mobile,
            'రెండవ మొబైల్': v.second_mobile,
            'స్థితి (Status)': v.death
        }));

        const ws = XLSX.utils.json_to_sheet(exportData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Voters_Ward19");
        XLSX.writeFile(wb, "Voter_List_Ward19.xlsx");
    }

    // Backup & Restore
    function downloadBackup() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(votersData, null, 2));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        dlAnchorElem.setAttribute("download", "voter_list_ward19_backup.json");
        document.body.appendChild(dlAnchorElem);
        dlAnchorElem.click();
        dlAnchorElem.remove();
    }

    function triggerRestore() {
        document.getElementById('restoreFileInput').click();
    }

    function restoreData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    if (confirm('ఇప్పుడున్న డేటాను ఈ బ్యాకప్ డేటాతో మార్చాలనుకుంటున్నారా?')) {
                        votersData = importedData;
                        saveData();
                        alert('డేటా విజయవంతంగా రీస్టోర్ చేయబడింది!');
                    }
                } else {
                    alert('చెల్లని ఫైల్ ఫార్మాట్!');
                }
            } catch (ex) {
                alert('ఫైల్ చదవడంలో లోపం జరిగింది.');
            }
        };
        reader.readAsText(file);
    }
</script>
</body>
</html>
