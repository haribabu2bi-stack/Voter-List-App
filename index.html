<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3">
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 16px; background: #f5f6fa; color: #222; }
    h2 { color: #243b64; font-size: 25px; }
    label { display: block; margin: 12px 0 5px; font-size: 16px; font-weight: bold; }
    input, select, button { padding: 10px; margin: 4px 0; font-size: 16px; border-radius: 5px; }
    #searchBy, #search { width: 100%; max-width: 400px; min-height: 48px; }
    .export-area { margin-top: 14px; padding: 12px; background: white; border-radius: 8px; }
    .table-wrap { overflow-x: auto; margin-top: 15px; -webkit-overflow-scrolling: touch; }
    table { border-collapse: collapse; width: 100%; background: white; }
    th, td { border: 1px solid #ddd; padding: 9px; text-align: left; white-space: nowrap; }
    th { background: #243b64; color: white; }
    button { background: #176b42; color: white; border: 0; cursor: pointer; min-height: 42px; padding: 10px 16px; }
    button:disabled { opacity: 0.6; }
    #message { margin: 12px 4px; overflow-wrap: anywhere; }
    .caste-input, .paid-input, .mobile-input { width: 140px; }
    @media screen and (max-width: 600px) {
      body { margin: 12px; font-size: 18px; }
      h2 { font-size: 28px; margin-bottom: 20px; }
      label { font-size: 19px; margin-top: 16px; }
      #searchBy, #search {
        display: block; width: 100%; max-width: none; min-height: 60px;
        font-size: 20px; padding: 14px; margin: 8px 0 14px;
        border: 1px solid #888; background: white;
      }
      button { min-height: 54px; font-size: 18px; padding: 12px 16px; margin: 5px 3px; }
      th, td { padding: 12px; font-size: 16px; }
      td input, td select { min-height: 50px; font-size: 17px; }
      .caste-input, .paid-input, .mobile-input { width: 150px; }
    }
  </style>
</head>
<body>
  <h2>Voter Payment Status</h2>

  <label for="searchBy">Search By:</label>
  <select id="searchBy">
    <option value="sno">S.No</option>
    <option value="name">Name</option>
    <option value="mobile">Mobile</option>
    <option value="initial">Initial (English)</option>
    <option value="caste">Caste</option>
  </select>

  <label for="search">Search Value:</label>
  <input id="search" type="text" list="searchOptions"
    placeholder="Select or type to search..." autocomplete="off">
  <datalist id="searchOptions"></datalist>

  <div class="export-area">
    <strong>Export Options</strong><br>
    <button onclick="exportData('all','csv')">Export All CSV</button>
    <button onclick="exportData('all','xls')">Export All Excel</button><br>
    <button onclick="exportData('filtered','csv')">Export Filtered CSV</button>
    <button onclick="exportData('filtered','xls')">Export Filtered Excel</button>
  </div>

  <div id="message">Loading voter list...</div>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>S.No</th><th>Name</th><th>Father/Husband Name</th>
        <th>Mobile (Editable)</th><th>Initial</th><th>Caste (Editable)</th>
        <th>Payment Status</th><th>Paid By</th><th>Vote Cast</th><th>Action</th>
      </tr></thead>
      <tbody id="voters"></tbody>
    </table>
  </div>

<script>
  var records = [];

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('searchBy').addEventListener('change', function() {
    document.getElementById('search').value = '';
    updateSearchOptions();
    render();
  });

  function updateSearchOptions() {
    var key = document.getElementById('searchBy').value;
    var datalist = document.getElementById('searchOptions');
    var values = [];
    records.forEach(function(r) {
      var value = String(r[key] || '').trim();
      if (value && values.indexOf(value) === -1) values.push(value);
    });
    values.sort(function(a, b) { return a.localeCompare(b); });
    datalist.replaceChildren();
    values.forEach(function(value) {
      var option = document.createElement('option');
      option.value = value;
      datalist.appendChild(option);
    });
  }

  function loadVoters() {
    document.getElementById('message').textContent = 'Loading voter list...';
    google.script.run
      .withSuccessHandler(function(data) {
        records = data || [];
        updateSearchOptions();
        render();
        document.getElementById('message').textContent = records.length + ' records loaded';
      })
      .withFailureHandler(function(err) {
        document.getElementById('message').textContent = 'Error: ' + (err.message || err);
      })
      .getVoters();
  }

  function getFilteredRecords(scope) {
    if (scope === 'all') return records.slice();
    var query = document.getElementById('search').value.trim().toLowerCase();
    var key = document.getElementById('searchBy').value;
    return records.filter(function(r) {
      return String(r[key] || '').toLowerCase().includes(query);
    });
  }

  function render() {
    var filtered = getFilteredRecords('filtered');
    var tbody = document.getElementById('voters');
    tbody.replaceChildren();

    filtered.forEach(function(r) {
      var tr = document.createElement('tr');

      function addCell(value) {
        var td = document.createElement('td');
        td.textContent = value == null ? '' : value;
        tr.appendChild(td);
      }

      function addInput(value, className) {
        var td = document.createElement('td');
        var input = document.createElement('input');
        input.type = 'text';
        input.maxLength = className === 'mobile-input' ? 20 : 100;
        input.className = className;
        input.value = value || '';
        td.appendChild(input);
        tr.appendChild(td);
        return input;
      }

      addCell(r.sno);
      addCell(r.name);
      addCell(r.father);
      var mobileInput = addInput(r.mobile, 'mobile-input');
      addCell(r.initial);
      var casteInput = addInput(r.caste, 'caste-input');

      var statusCell = document.createElement('td');
      var status = document.createElement('select');
      ['Pending', 'Paid'].forEach(function(value) {
        var option = document.createElement('option');
        option.value = value; option.textContent = value; status.appendChild(option);
      });
      status.value = r.status === 'Paid' ? 'Paid' : 'Pending';
      statusCell.appendChild(status); tr.appendChild(statusCell);

      var paidBy = addInput(r.paidBy, 'paid-input');

      var voteCell = document.createElement('td');
      var vote = document.createElement('select');
      ['Not Done', 'Done'].forEach(function(value) {
        var option = document.createElement('option');
        option.value = value; option.textContent = value; vote.appendChild(option);
      });
      vote.value = r.voteCast === 'Done' ? 'Done' : 'Not Done';
      voteCell.appendChild(vote); tr.appendChild(voteCell);

      var actionCell = document.createElement('td');
      var save = document.createElement('button');
      save.textContent = 'Save';
      save.onclick = function() {
        save.disabled = true; save.textContent = 'Saving...';
        google.script.run
          .withSuccessHandler(function(msg) {
            r.status = status.value;
            r.paidBy = paidBy.value;
            r.caste = casteInput.value;
            r.mobile = mobileInput.value;
            r.voteCast = vote.value;
            save.disabled = false; save.textContent = 'Save';
            document.getElementById('message').textContent = 'S.No ' + r.sno + ': ' + msg;
            updateSearchOptions();
          })
          .withFailureHandler(function(err) {
            save.disabled = false; save.textContent = 'Save';
            document.getElementById('message').textContent = 'Save failed: ' + (err.message || err);
          })
          .updatePayment(r.row, status.value, paidBy.value, casteInput.value, mobileInput.value, vote.value);
      };
      actionCell.appendChild(save); tr.appendChild(actionCell);
      tbody.appendChild(tr);
    });

    if (filtered.length === 0 && records.length > 0) {
      document.getElementById('message').textContent = 'No matching records found.';
    }
  }

  function exportData(scope, format) {
    document.getElementById('message').textContent = 'Preparing export with latest saved data...';
    google.script.run
      .withSuccessHandler(function(freshRecords) {
        records = freshRecords || [];
        updateSearchOptions();
        render();

        var selected = getFilteredRecords(scope);
        if (!selected.length) {
          document.getElementById('message').textContent = 'No records available to export.';
          return;
        }

        var headers = ['S.No', 'Name', 'Father/Husband Name', 'Mobile', 'Initial',
          'Caste', 'Payment Status', 'Paid By', 'Vote Cast'];
        var rows = selected.map(function(r) {
          return [r.sno, r.name, r.father, r.mobile, r.initial, r.caste, r.status, r.paidBy, r.voteCast];
        });

        if (format === 'csv') {
          var csv = [headers].concat(rows).map(function(row) {
            return row.map(function(value) {
              var text = String(value == null ? '' : value);
              return '"' + text.replace(/"/g, '""') + '"';
            }).join(',');
          }).join('\r\n');
          downloadFile('\uFEFF' + csv, 'voter_list.csv', 'text/csv;charset=utf-8;');
        } else {
          var html = '<html><head><meta charset="UTF-8"></head><body><table><thead><tr>';
          html += headers.map(escapeHtml).map(function(h) { return '<th>' + h + '</th>'; }).join('');
          html += '</tr></thead><tbody>';
          rows.forEach(function(row) {
            html += '<tr>' + row.map(function(value) { return '<td>' + escapeHtml(value) + '</td>'; }).join('') + '</tr>';
          });
          html += '</tbody></table></body></html>';
          downloadFile('\uFEFF' + html, 'voter_list.xls', 'application/vnd.ms-excel;charset=utf-8;');
        }

        document.getElementById('message').textContent = selected.length + ' records exported.';
      })
      .withFailureHandler(function(err) {
        document.getElementById('message').textContent = 'Export failed: ' + (err.message || err);
      })
      .getVoters();
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function downloadFile(content, filename, mimeType) {
    var blob = new Blob([content], { type: mimeType });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url; link.download = filename;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  }

  loadVoters();
</script>
</body>
</html>
