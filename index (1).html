<html lang="te">

    <title>Ward 19 Voter List Directory</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->

    <style>

        body {

            background-color: #f8fafc;
        }

</head>
<body class="text-slate-800">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold flex items-center gap-2">
                        <i class="fa-solid fa-address-card"></i>
                        Ward 19 Voter Directory
                    </h1>
                    <p class="text-indigo-200 text-sm mt-1">వార్డు 19 ఓటర్ల సమాచారం మరియు శోధన పోర్టల్</p>
                </div>
                <!-- Stats Badge -->
                <div class="flex items-center gap-3">
                    <span class="bg-indigo-800/80 border border-indigo-500/30 px-3 py-1.5 rounded-lg text-sm font-medium">
                        మొత్తం ఓటర్లు: <strong class="text-white text-base" id="totalCount">0</strong>
                    </span>
                </div>
            </div>
        </div>
    </header>

    <!-- Controls Section -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6">
            <div class="flex flex-col lg:flex-row gap-4 justify-between items-stretch lg:items-center">
                
                <!-- Search Box -->
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="పేరు, తండ్రి/భర్త పేరు, Voter ID, కులం ద్వారా శోధించండి..." 
                        class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-all">
                </div>

                <!-- Filters & Toggle -->
                <div class="flex flex-wrap items-center gap-3">
                    
                    <!-- Gender Filter -->
                    <select id="genderFilter" class="bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-2.5">
                        <option value="">అన్ని లింగాలు (Gender)</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>

                    <!-- View Switcher -->
                    <div class="flex items-center bg-slate-100 p-1 rounded-lg border border-slate-200">
                        <button id="listViewBtn" class="px-3 py-1.5 rounded-md text-sm font-medium transition-all flex items-center gap-2 bg-white text-indigo-600 shadow-sm">
                            <i class="fa-solid fa-list"></i>
                            <span class="hidden sm:inline">List View</span>
                        </button>
                        <button id="gridViewBtn" class="px-3 py-1.5 rounded-md text-sm font-medium transition-all flex items-center gap-2 text-slate-600 hover:text-slate-900">
                            <i class="fa-solid fa-border-all"></i>
                            <span class="hidden sm:inline">Grid View</span>
                        </button>
                    </div>

                </div>
            </div>
        </div>

        <!-- Content Container -->
        <div id="voterContainer"></div>
        
        <!-- No Results -->
        <div id="noResults" class="hidden text-center py-12 bg-white rounded-xl border border-slate-200">
            <i class="fa-solid fa-user-slash text-4xl text-slate-300 mb-3"></i>
            <h3 class="text-lg font-semibold text-slate-600">ఎటువంటి ఫలితాలు లభించలేదు</h3>

        </div>
    </main>

                return;
            }
            noResults.classList.add('hidden');

            if (currentView === 'list') {
                renderListView();
            } else {
                renderGridView();
            }
        }

        function renderListView() {
            let html = `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
                                    <th class="py-3.5 px-4 text-center">క్రమ సంఖ్య</th>
                                    <th class="py-3.5 px-4">పేరు (Name)</th>
                                    <th class="py-3.5 px-4">తండ్రి / భర్త</th>
                                    <th class="py-3.5 px-4">Voter ID</th>
                                    <th class="py-3.5 px-4 text-center">లింగం / వయస్సు</th>
                                    <th class="py-3.5 px-4">కులం (Caste)</th>
                                    <th class="py-3.5 px-4">మొబైల్ నంబర్</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
            `;

            filteredData.forEach(item => {
                const genderBadge = item.gender.toLowerCase() === 'female' 
                    ? '<span class="px-2 py-0.5 rounded-full text-xs font-medium bg-pink-100 text-pink-700">Female</span>' 
                    : '<span class="px-2 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-700">Male</span>';

                html += `
                    <tr class="hover:bg-slate-50/80 transition-colors">
                        <td class="py-3 px-4 text-center font-medium text-slate-500">${item.sno || '-'}</td>
                        <td class="py-3 px-4 font-semibold text-slate-900">${item.name || '-'}</td>
                        <td class="py-3 px-4 text-slate-600">${item.relative || '-'}</td>
                        <td class="py-3 px-4 font-mono font-medium text-indigo-600">${item.voter_id || '-'}</td>
                        <td class="py-3 px-4 text-center">
                            ${genderBadge}
                            <span class="text-slate-500 ml-1">${item.age ? item.age + ' Yrs' : ''}</span>
                        </td>
                        <td class="py-3 px-4 text-slate-600">${item.caste || '-'}</td>
                        <td class="py-3 px-4 text-slate-700">${item.mobile ? '<i class="fa-solid fa-phone text-xs text-slate-400 mr-1"></i>' + item.mobile : '-'}</td>
                    </tr>
                `;
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function renderGridView() {
            let html = '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">';

            filteredData.forEach(item => {
                const isFemale = item.gender.toLowerCase() === 'female';
                const genderIcon = isFemale ? 'fa-female text-pink-500' : 'fa-male text-blue-500';
                const cardBorder = isFemale ? 'border-l-pink-500' : 'border-l-blue-500';

                html += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 border-l-4 ${cardBorder} p-4 flex flex-col justify-between hover:shadow-md transition-shadow">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-xs font-semibold px-2 py-0.5 bg-slate-100 text-slate-600 rounded">#${item.sno}</span>
                                <span class="font-mono text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">${item.voter_id}</span>
                            </div>
                            <h3 class="font-bold text-slate-900 text-base mb-1">${item.name}</h3>
                            <p class="text-xs text-slate-500 mb-3"><i class="fa-solid fa-user-group text-slate-400 mr-1"></i> తండ్రి/భర్త: <span class="text-slate-700 font-medium">${item.relative || '-'}</span></p>
                        </div>

                        <div class="pt-3 border-t border-slate-100 text-xs space-y-1.5 text-slate-600">
                            <div class="flex justify-between">
                                <span><i class="fa-solid ${genderIcon} mr-1"></i> లింగం / వయస్సు:</span>
                                <span class="font-medium">${item.gender} (${item.age} Yrs)</span>
                            </div>
                            <div class="flex justify-between">
                                <span><i class="fa-solid fa-layer-group text-slate-400 mr-1"></i> కులం:</span>
                                <span class="font-medium text-slate-800">${item.caste || '-'}</span>
                            </div>
                            <div class="flex justify-between">
                                <span><i class="fa-solid fa-phone text-slate-400 mr-1"></i> ఫోన్:</span>
                                <span class="font-medium text-slate-800">${item.mobile || '-'}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        function filterData() {
            const query = searchInput.value.toLowerCase().trim();
            const selectedGender = genderFilter.value;

            filteredData = votersData.filter(item => {
                const matchQuery = 
                    item.name.toLowerCase().includes(query) ||
                    item.relative.toLowerCase().includes(query) ||
                    item.voter_id.toLowerCase().includes(query) ||
                    item.caste.toLowerCase().includes(query) ||
                    item.mobile.includes(query);

                const matchGender = selectedGender === '' || item.gender === selectedGender;

                return matchQuery && matchGender;
            });

            renderData();
        }

        // Event Listeners
        searchInput.addEventListener('input', filterData);
        genderFilter.addEventListener('change', filterData);

        listViewBtn.addEventListener('click', () => {
            currentView = 'list';
            listViewBtn.className = 'px-3 py-1.5 rounded-md text-sm font-medium transition-all flex items-center gap-2 bg-white text-indigo-600 shadow-sm';
            gridViewBtn.className = 'px-3 py-1.5 rounded-md text-sm font-medium transition-all flex items-center gap-2 text-slate-600 hover:text-slate-900';
            renderData();
        });

        gridViewBtn.addEventListener('click', () => {
            currentView = 'grid';
            gridViewBtn.className = 'px-3 py-1.5 rounded-md text-sm font-medium transition-all flex items-center gap-2 bg-white text-indigo-600 shadow-sm';
            listViewBtn.className = 'px-3 py-1.5 rounded-md text-sm font-medium transition-all flex items-center gap-2 text-slate-600 hover:text-slate-900';
            renderData();
        });

        // Initial Render
        renderData();
    </script>
</body>
</html>
